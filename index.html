function closeAllSheets() {
  document.getElementById('sheetOverlay')?.remove();
  document.getElementById('sheetEl')?.remove();
}

// ===== Share to iCloud Drive (Web Share API) =====
async function shareJSON() {
  const json = JSON.stringify(state, null, 2);
  const filename = `daily-${todayKey()}.json`;
  try {
    const file = new File([json], filename, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Резервная копия задач', text: 'Бэкап ежедневника' });
      return;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return;
  }
  // Fallback: regular download
  exportJSON();
}

// ===== Swipe actions =====
function attachSwipe(swipeWrap, taskEl, taskId) {
  let startX = null, startY = null, dx = 0, locked = null, active = false;
  const TRIGGER = 80;

  taskEl.addEventListener('touchstart', e => {
    if (!isMobile()) return;
    if (e.target.closest('.check')) return;
    const t = e.touches[0];
    startX = t.clientX; startY = t.clientY;
    dx = 0; locked = null; active = true;
    swipeWrap.classList.add('swiping');
  }, { passive: true });

  taskEl.addEventListener('touchmove', e => {
    if (!active) return;
    const t = e.touches[0];
    const ddx = t.clientX - startX;
    const ddy = t.clientY - startY;
    if (locked === null) {
      if (Math.abs(ddx) > 8 && Math.abs(ddx) > Math.abs(ddy)) locked = 'x';
      else if (Math.abs(ddy) > 8) locked = 'y';
    }
    if (locked !== 'x') return;
    dx = ddx;
    taskEl.style.transform = `translateX(${dx}px)`;
  }, { passive: true });

  taskEl.addEventListener('touchend', () => {
    if (!active) return;
    active = false;
    swipeWrap.classList.remove('swiping');
    if (locked !== 'x') { taskEl.style.transform = ''; return; }
    if (dx <= -TRIGGER) {
      // swipe left → delete
      taskEl.style.transform = `translateX(-100%)`;
      setTimeout(() => {
        deleteTaskWithUndo(taskId);
        renderTaskList();
        renderHeader();
        renderOverdueBanner();
      }, 180);
    } else if (dx >= TRIGGER) {
      // swipe right → toggle done
      taskEl.style.transform = '';
      const task = state.tasks.find(t => t.id === taskId);
      if (task) {
        setStatus(task, task.status === 'done' ? 'todo' : 'done');
        renderHeader();
        renderOverdueBanner();
        renderTaskList();
      }
    } else {
      taskEl.style.transform = '';
    }
  });

  taskEl.addEventListener('touchcancel', () => {
    active = false;
    swipeWrap.classList.remove('swiping');
    taskEl.style.transform = '';
  });
}

// ===== Pull-to-refresh =====
(function setupPullToRefresh() {
  const indicator = document.getElementById('pullIndicator');
  let startY = null, pulling = false, dy = 0;
  const TRIGGER = 70;

  document.addEventListener('touchstart', e => {
    if (!isMobile()) return;
    if (window.scrollY > 0) return;
    if (e.target.closest('.panel, .filters-sheet')) return;
    startY = e.touches[0].clientY;
    pulling = true;
    dy = 0;
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    if (!pulling) return;
    dy = e.touches[0].clientY - startY;
    if (dy > 0 && window.scrollY === 0) {
      const v = Math.min(dy * 0.6, 90);
      indicator.style.setProperty('--pull-y', v + 'px');
      indicator.classList.add('pulling');
      indicator.textContent = dy > TRIGGER ? '↻' : '↓';
    } else {
      indicator.classList.remove('pulling');
    }
  }, { passive: true });

  document.addEventListener('touchend', () => {
    if (!pulling) return;
    pulling = false;
    if (dy > TRIGGER) {
      indicator.classList.remove('pulling');
      indicator.classList.add('refreshing');
      indicator.textContent = '↻';
      setTimeout(() => {
        indicator.classList.remove('refreshing');
        render();
      }, 600);
    } else {
      indicator.classList.remove('pulling');
    }
    dy = 0;
  });
})();

// ===== Wrap tasks with swipe layer on mobile =====
const _origRenderTaskList = renderTaskList;
renderTaskList = function() {
  _origRenderTaskList();
  if (!isMobile()) return;
  document.querySelectorAll('#taskList .task').forEach(taskEl => {
    if (taskEl.parentElement.classList.contains('task-swipe')) return;
    const id = taskEl.dataset.id;
    const wrap = document.createElement('div');
    wrap.className = 'task-swipe';
    wrap.innerHTML = '<div class="swipe-action swipe-right">✓</div><div class="swipe-action swipe-left">🗑</div>';
    taskEl.parentNode.insertBefore(wrap, taskEl);
    wrap.appendChild(taskEl);
    attachSwipe(wrap, taskEl, id);
  });
  syncBottomBar();
};

// Initial
render();
syncBottomBar();
